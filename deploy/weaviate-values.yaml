# Helm values for the official chart: helm install weaviate weaviate/weaviate -n weaviate --create-namespace -f deploy/weaviate-values.yaml
# Vectors come from Ollama (vectorizer: none), so no Weaviate modules are needed.
replicas: 1
service:
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 80
      nodePort: 30080
grpcService:
  enabled: true
  type: NodePort
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      nodePort: 30051
storage:
  size: 2Gi
  # storageClassName: local-path   # set one if your cluster has no default StorageClass
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
